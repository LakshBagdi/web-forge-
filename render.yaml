# FlowForge on Render — ONE service serves the website + the API, plus a free Postgres and Redis (Key Value).
# Use it with: Render dashboard → New + → Blueprint → pick this repo → Apply.
# Full beginner steps: README → "Deploy (step by step)".
databases:
  - name: flowforge-db
    plan: free
    databaseName: flowforge
    user: flowforge

services:
  - type: keyvalue
    name: flowforge-redis
    plan: free
    maxmemoryPolicy: noeviction   # BullMQ (the job queue) must never lose keys
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere (protected by the private connection string)

  - type: web
    name: flowforge
    runtime: node
    plan: free
    # build the website, then install the server (dev tools are needed to build the website)
    buildCommand: npm --prefix frontend install --include=dev && npm --prefix frontend run build && npm --prefix backend install
    startCommand: npm --prefix backend start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: JWT_SECRET
        generateValue: true       # random, created once for you
      - key: CREDENTIAL_KEY
        generateValue: true       # random, created once — KEEP IT: it unlocks saved logins/API keys
      - key: DATABASE_URL
        fromDatabase:
          name: flowforge-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: flowforge-redis
          property: connectionString
